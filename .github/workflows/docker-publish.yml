name: Docker Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:latest ./server

      - name: Build frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:latest ./game

      - name: Push backend
        run: |
          docker push ghcr.io/${{ github.repository }}/backend:latest

      - name: Push frontend
        run: |
          docker push ghcr.io/${{ github.repository }}/frontend:latest